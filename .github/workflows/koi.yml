# Separate workflow for the Git Koi profile animation.
# The existing GitHub Snake workflow remains unchanged.
name: Git Koi

on:
  schedule:
    # Draw the previous complete UTC day shortly after midnight.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/koi.yml

permissions:
  contents: write

concurrency:
  group: git-koi
  cancel-in-progress: false

jobs:
  generate-koi:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Generate Git Koi
        uses: yalongwastaken/git-koi@v1
        with:
          body: white
          output-dir: koi

      - name: Commit updated koi animation
        shell: bash
        run: |
          git add koi/koi.gif
          if git diff --cached --quiet; then
            echo "The koi has not changed; no commit is needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "chore: update Git Koi animation"
          git push --quiet
